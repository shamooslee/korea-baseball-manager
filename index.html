  return `${nav('친선경기','순위에 영향 없이 자유롭게 대결할 수 있어요')}<div class="screen">${rows}</div>`;
}

function screenPacks(){
  if(state.packs.length===0){
    return `${nav('팩 개봉')}<div class="screen"><div class="card" style="text-align:center;color:#9aa4b2;">보유한 팩이 없습니다.<br>과제를 완료해서 팩을 받아보세요!</div></div>`;
  }
  const rows = state.packs.map((tier,i)=>`
    <div class="pickCard">
      <div>${rarityChip(rarityOf({common:50,rare:70,epic:80,legend:90}[tier]))} 카드팩</div>
      <button class="btn small" onclick="openPack(${i})">개봉하기</button>
    </div>`).join('');
  return `${nav('팩 개봉', `${state.packs.length}개 보유중`)}<div class="screen">${rows}</div>`;
}

function lvChip(p){
  ensureGrowth(p);
  const max = p.lv >= MAX_LV;
  return `<span class="rarityChip" style="background:${max?'#ffd54a':'#4ea1ff'};">Lv.${p.lv}${max?' MAX':''}</span>`;
}
function rosterRow(p){
  ensureGrowth(p); ensureStat(p);
  const c = ensureCondition(p);
  const stats = p.type==='batter'
    ? `컨택${p.contact} 파워${p.power} 스피드${p.speed}`
    : `제구${p.control} 구위${p.stuff} 체력${p.stamina}`;
  const use = isInUse(p) ? `<span class="statline" style="color:#7fdc8a;"> · 출전중</span>` : '';
  const line = p.type==='batter'
    ? (p.stat.ab ? ` · 타율 ${fmtAvg(battingAvg(p.stat))}` : '')
    : (p.stat.outs ? ` · 방어율 ${fmtEra(p.stat)}` : '');
  return `
    <div class="pickCard" onclick="openPlayerDetail(${p.id},'${p.type}')" style="cursor:pointer;">
      <div>
        <b>${p.name}</b> <span class="statline">${p.pos}</span>${use}
        <div class="statline">${stats}${line}</div>
      </div>
      <div style="text-align:right;white-space:nowrap;">
        ${lvChip(p)} <span title="${c.label}">${c.icon}</span>
        <br><span style="font-size:10px;">${rarityChip(p.rarity)} ${buffTag(p)}</span>
      </div>
    </div>`;
}
function screenRoster(){
  const batters = state.roster.batters.map(rosterRow).join('');
  const pitchers = state.roster.pitchers.map(rosterRow).join('');
  return `${nav('보유 선수','선수를 탭하면 키우거나 이름을 바꿀 수 있어요')}<div class="screen">
    <div class="card"><b>타자 (${state.roster.batters.length}명)</b>${batters}</div>
    <div class="card"><b>투수 (${state.roster.pitchers.length}명)</b>${pitchers}</div>
  </div>`;
}

/* ---------- 순위표 ---------- */
function screenStandings(){
  const rows = standingsSorted().map((r,i)=>{
    const me = r.team.id === state.team.id;
    const rank = i+1;
    const medal = rank===1 ? '🥇' : rank===2 ? '🥈' : rank===3 ? '🥉' : rank;
    return `<tr style="${me?'background:#1d2536;font-weight:800;':''}">
      <td>${medal}</td>
      <td style="text-align:left;padding-left:6px;">
        <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${r.team.color};margin-right:5px;"></span>${r.team.name}${me?' ⭐':''}
      </td>
      <td>${r.g}</td><td>${r.w}</td><td>${r.l}</td>
      <td>${r.g ? fmtAvg(r.pct) : '-'}</td>
      <td style="color:${r.diff>0?'#7fdc8a':r.diff<0?'#ff8a8a':'#9aa4b2'};">${r.diff>0?'+':''}${r.diff}</td>
    </tr>`;
  }).join('');
  const played = standingsSorted().reduce((s,r)=>s+r.g,0)/2;
  return `${nav('리그 순위표', `${state.season}시즌 · ${TIERS[state.tier]} 리그`)}
  <div class="screen">
    <div class="card">
      <table class="box">
        <thead><tr><th>순위</th><th>팀</th><th>경기</th><th>승</th><th>패</th><th>승률</th><th>득실</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="statline" style="margin-top:10px;">
        ${played ? `지금까지 리그 전체 ${played}경기가 치러졌어요.` : '아직 경기가 없어요. 리그모드에서 경기를 해보세요.'}
        <br>내가 한 경기를 치를 때마다 다른 팀들끼리도 경기를 해요.
      </div>
    </div>
  </div>`;
}

/* ---------- 팀 기록실 (선수별 시즌 성적) ---------- */
function screenStats(){
  ensureAllStats();
  const bs = state.roster.batters.slice()
    .filter(p=>p.stat.ab>0 || p.stat.bb>0)
    .sort((a,b)=> battingAvg(b.stat)-battingAvg(a.stat));
  const ps = state.roster.pitchers.slice()
    .filter(p=>p.stat.bf>0)
    .sort((a,b)=> (a.stat.outs?eraOf(a.stat):999) - (b.stat.outs?eraOf(b.stat):999));

  const bRows = bs.map(p=>`<tr>
      <td style="text-align:left;padding-left:5px;">${p.name}</td>
      <td>${p.stat.g}</td><td>${p.stat.ab}</td><td>${p.stat.h}</td>
      <td>${p.stat.hr}</td><td>${p.stat.rbi}</td>
      <td><b>${p.stat.ab ? fmtAvg(battingAvg(p.stat)) : '-'}</b></td>
    </tr>`).join('') || `<tr><td colspan="7" class="statline">아직 기록이 없어요</td></tr>`;

  const pRows = ps.map(p=>`<tr>
      <td style="text-align:left;padding-left:5px;">${p.name}</td>
      <td>${p.stat.g}</td>
      <td>${Math.floor(p.stat.outs/3)}.${p.stat.outs%3}</td>
      <td>${p.stat.k}</td><td>${p.stat.w}</td><td>${p.stat.l}</td>
      <td><b>${fmtEra(p.stat)}</b></td>
    </tr>`).join('') || `<tr><td colspan="7" class="statline">아직 기록이 없어요</td></tr>`;

  const hrKing = state.roster.batters.slice().sort((a,b)=>b.stat.hr-a.stat.hr)[0];
  const avgKing = bs[0];
  return `${nav('팀 기록실', `${state.season}시즌 기록 · 시즌이 끝나면 초기화돼요`)}
  <div class="screen">
    ${(avgKing || (hrKing && hrKing.stat.hr)) ? `
    <div class="card">
      <b>시즌 순위</b>
      <div class="statline" style="margin-top:6px;line-height:1.9;">
        ${avgKing ? `🏆 타율왕 — <b>${avgKing.name}</b> ${fmtAvg(battingAvg(avgKing.stat))}<br>` : ''}
        ${hrKing && hrKing.stat.hr ? `💥 홈런왕 — <b>${hrKing.name}</b> ${hrKing.stat.hr}홈런` : ''}
      </div>
    </div>` : ''}
    <div class="card">
      <b>타자</b>
      <table class="box">
        <thead><tr><th>이름</th><th>경기</th><th>타수</th><th>안타</th><th>홈런</th><th>타점</th><th>타율</th></tr></thead>
        <tbody>${bRows}</tbody>
      </table>
    </div>
    <div class="card">
      <b>투수</b>
      <table class="box">
        <thead><tr><th>이름</th><th>경기</th><th>이닝</th><th>삼진</th><th>승</th><th>패</th><th>방어율</th></tr></thead>
        <tbody>${pRows}</tbody>
      </table>
      <div class="statline" style="margin-top:8px;">방어율은 9이닝당 내준 점수예요. 낮을수록 좋아요.</div>
    </div>
  </div>`;
}

/* ---------- 선수 상세: 레벨 / 훈련 / 합성 ---------- */
function screenPlayerDetail(){
  if(!state.detail) return screenRoster();
  const p = findPlayer(state.detail.id, state.detail.ptype);
  if(!p){ state.screen='roster'; return screenRoster(); }
  ensureGrowth(p); ensureStat(p);
  const cond = ensureCondition(p);
  const st = p.stat;
  const ks = statKeys(p);
  const maxLv = p.lv >= MAX_LV;
  const need = expNeeded(p.lv);
  const pct = maxLv ? 100 : Math.min(100, Math.round(p.exp / need * 100));

  const statRows = ks.map(k=>{
    const cost = trainCost(p,k);
    const full = p[k] >= 99;
    const canPay = state.coins >= cost;
    return `
    <div class="lineupRow">
      <div class="pos" style="width:46px;">${STAT_LABEL[k]}</div>
      <div class="nm">
        ${p[k]}
        <div class="progressBar" style="margin-top:5px;"><div class="progressFill" style="width:${p[k]}%;"></div></div>
      </div>
      <button class="btn small ${full||!canPay?'secondary':''}" onclick="doTrain(${p.id},'${p.type}','${k}')">
        ${full ? 'MAX' : `+1 · 💰${cost}`}
      </button>
    </div>`;
  }).join('');

  const canFuse = fuseCandidates(p).length > 0;
  return `${nav(p.name, `${p.pos} · 보유 코인 💰${state.coins}`)}
  <div class="screen">
    <div class="card">
      <div class="row">
        <div><span style="font-size:19px;font-weight:900;">${p.name}</span> ${rarityChip(p.rarity)} ${buffTag(p)}</div>
        ${lvChip(p)}
      </div>
      <div class="statline" style="margin-top:8px;">
        ${maxLv ? '최고 레벨에 도달했어요' : `다음 레벨까지 경험치 ${p.exp} / ${need}`}
      </div>
      <div class="progressBar"><div class="progressFill" style="width:${pct}%;background:linear-gradient(90deg,#4ea1ff,#7fdc8a);"></div></div>
      <div class="statline" style="margin-top:8px;">
        경기에 나가면 경험치를 얻어요 · 지금까지 훈련 ${p.trained}회
      </div>
    </div>

    <div class="card">
      <div class="row">
        <b>오늘의 컨디션</b>
        <span class="rarityChip" style="background:${cond.color};">${cond.icon} ${cond.label}</span>
      </div>
      <div class="statline" style="margin-top:6px;">
        오늘 경기에서 모든 능력치 <b style="color:${cond.color};">${cond.mod>0?'+':''}${cond.mod}</b>
        ${cond.mod===0?' (변화 없음)':''} · 컨디션은 날마다 바뀌어요
      </div>
    </div>

    <div class="card">
      <div class="row"><b>${state.season}시즌 기록</b><span class="statline">${st.g}경기 출전</span></div>
      <div class="statline" style="margin-top:8px;line-height:1.9;">
      ${p.type==='batter'
        ? `타수 ${st.ab} · 안타 ${st.h} · 홈런 ${st.hr} · 타점 ${st.rbi} · 볼넷 ${st.bb}<br>
           타율 <b style="color:#7fdc8a;font-size:15px;">${st.ab ? fmtAvg(battingAvg(st)) : '-'}</b>`
        : `이닝 ${Math.floor(st.outs/3)}.${st.outs%3} · 삼진 ${st.k} · ${st.w}승 ${st.l}패<br>
           방어율 <b style="color:#7fdc8a;font-size:15px;">${fmtEra(st)}</b>
           ${p.type==='pitcher' ? `<br>체력 ${p.stamina} → 한 경기에 약 <b>${staminaLimit(p)}타자</b>까지 버텨요` : ''}`}
      </div>
    </div>

    <div class="card">
      <div class="row"><b>훈련</b><span class="statline">코인으로 능력치 +1</span></div>
      <div style="margin-top:8px;">${statRows}</div>
      <div class="statline" style="margin-top:4px;">능력치가 높을수록 훈련비가 비싸져요 (최대 99)</div>
    </div>

    <div class="card">
      <div class="row"><b>합성</b><span class="statline">안 쓰는 선수를 재료로 크게 키우기</span></div>
      <button class="btn ${canFuse?'':'secondary'}" onclick="${canFuse?`openFuse(${p.id},'${p.type}')`:''}">
        ${canFuse ? '🔥 재료 선수 고르기' : '재료로 쓸 수 있는 선수가 없어요'}
      </button>
    </div>

    <div class="card">
      <button class="btn secondary" onclick="openRename(${p.id},'${p.type}')">✏️ 이름 바꾸기</button>
      <button class="btn secondary" onclick="goto('roster')">← 보유 선수로 돌아가기</button>
    </div>
  </div>`;
}

/* ---------- 합성 화면 ---------- */
function screenFuse(){
  const F = state.fuse;
  if(!F) return screenRoster();
  const target = findPlayer(F.targetId, F.ptype);
  if(!target){ state.fuse=null; state.screen='roster'; return screenRoster(); }
  const cands = fuseCandidates(target);
  const points = F.selected
    .map(id=>cands.find(c=>c.id===id)).filter(Boolean)
    .reduce((s,m)=>s+fusePoints(m), 0);

  const rows = cands.map(c=>{
    const on = F.selected.indexOf(c.id) !== -1;
    const stats = c.type==='batter'
      ? `컨택${c.contact} 파워${c.power} 스피드${c.speed}`
      : `제구${c.control} 구위${c.stuff} 체력${c.stamina}`;
    return `
    <div class="pickCard" onclick="toggleFuseMaterial(${c.id})"
         style="cursor:pointer;border-color:${on?'#ff7a59':'#2a3242'};background:${on?'#20161a':'#0f131b'};">
      <div>
        <b>${on?'✅ ':''}${c.name}</b> <span class="statline">${c.pos} · Lv.${c.lv}</span>
        <div class="statline">${stats}</div>
      </div>
      <div style="text-align:right;white-space:nowrap;">
        ${rarityChip(c.rarity)}<br><span class="statline">+${fusePoints(c)}포인트</span>
      </div>
    </div>`;
  }).join('') || `<div class="statline">재료로 쓸 수 있는 선수가 없어요. 라인업이나 선발투수로 쓰는 선수는 재료가 될 수 없어요.</div>`;

  return `${nav('합성 - '+target.name, '재료는 최대 3명까지 고를 수 있어요')}
  <div class="screen">
    <div class="card">
      <div class="row"><b>${target.name}</b>${lvChip(target)}</div>
      <div class="statline" style="margin-top:6px;">
        고른 재료 ${F.selected.length}명 → 능력치 <b style="color:#7fdc8a;">+${points}포인트</b> 상승 예정
      </div>
      <div class="statline" style="color:#ff9d7a;margin-top:6px;">⚠️ 재료로 쓴 선수는 사라지고 되돌릴 수 없어요</div>
      <button class="btn ${F.selected.length?'':'secondary'}" onclick="${F.selected.length?'doFuse()':''}">
        ${F.selected.length ? `🔥 ${F.selected.length}명으로 합성하기` : '재료를 골라주세요'}
      </button>
      <button class="btn secondary" onclick="cancelFuse()">취소</button>
    </div>
    <div class="card"><b>재료로 쓸 선수 고르기</b><div style="margin-top:8px;">${rows}</div></div>
  </div>`;
}

      </div>

    </div>`;

}

function screenGoldenGlove(){

function screenPvpMatch(){

  if(P.status==='ended' && P.finalResult){
    const r = P.finalResult;
    const myRuns = P.role==='home' ? r.runsHome : r.runsAway;
    const oppRuns = P.role==='home' ? r.runsAway : r.runsHome;

    return `${nav('실시간 대결 결과')}

      <button class="btn" onclick="leavePvp()">확인</button>
    </div>`;
  }
  const myRuns = P.role==='home' ? P.runsHome : P.runsAway;
  const oppRuns = P.role==='home' ? P.runsAway : P.runsHome;
  let controls;
  if(P.myTurn==='pitch'){
    controls = `
      <div class="statline" style="text-align:center;margin-bottom:6px;">투구 선택 · 상대 타자 ${P.batterName||''}</div>
      <div class="typeToggle">
        <button class="typeBtn ${P.pitchAim.type==='fastball'?'active':''}" onclick="setPitchType('fastball')">🔥 직구</button>
        <button class="typeBtn ${P.pitchAim.type==='breaking'?'active':''}" onclick="setPitchType('breaking')">🌀 변화구</button>
      </div>
      <div class="pitchBox" id="pitchBox" onmousedown="pitchDragStart(event,'pitchBox')" ontouchstart="pitchDragStart(event,'pitchBox')">
        <div class="pitchZoneRect"></div>
        <div class="pitchReticle" id="pitchReticle" style="left:78px;top:78px;"></div>
      </div>
      <div class="statline" style="text-align:center;">코스를 드래그해서 조준하고 손을 떼면 던져요<br>노란 네모 <b>안</b>이면 스트라이크존 · <b>밖</b>이면 볼이 될 수 있어요</div>`;
  } else if(P.myTurn==='swing' && P.battingPhase==='pitching'){
    controls = `
      <div style="text-align:center;">
        <div class="statline" style="margin-bottom:10px;">⚾ 공이 날아오고 있어요! 타이밍에 맞춰 스윙!</div>
        <button class="swingBigBtn" onclick="pvpSwingTap()">SWING</button>
      </div>`;
  } else if(P.myTurn==='swing'){
    controls = `
      <div class="statline" style="text-align:center;margin-bottom:6px;">스윙 방식 선택 · 타자 ${P.batterName||''}</div>
      <div class="typeToggle">
        <button class="typeBtn ${P.swingType==='contact'?'active':''}" onclick="setPvpSwingType('contact')">🎯 정교한 컨택</button>
        <button class="typeBtn ${P.swingType==='power'?'active':''}" onclick="setPvpSwingType('power')">💥 강한 스윙</button>
      </div>
      <div class="statline" style="text-align:center;">상대가 투구를 준비하는 중입니다...</div>`;
  } else {
    controls = `<div class="card" style="text-align:center;color:#9aa4b2;">상대방의 선택을 기다리는 중...</div>`;
  }
  return `${nav('실시간 대결 · vs ' + (P.opponentName||''), `${P.inning}회 ${P.half==='top'?'초':'말'}`)}
  <div class="screen">
    <div class="live3dSpacer"></div>
    <div class="card" style="margin-top:0;">
      <div class="scoreBig" style="font-size:26px;">${myRuns} : ${oppRuns}</div>
      <div class="row" style="justify-content:center;gap:14px;font-size:12px;color:#9aa4b2;">
        <span>아웃 ${P.outs}</span><span>1루 ${P.bases[0]?'●':'○'}</span><span>2루 ${P.bases[1]?'●':'○'}</span><span>3루 ${P.bases[2]?'●':'○'}</span>
      </div>
    </div>
    <div class="card">${controls}</div>
    <div class="logBox">${P.log.slice(0,6).map(l=>`<div>${l}</div>`).join('')}</div>
  </div>`;
}

function screenMatchResult(){
  const r = state.lastResult;
  const maxInn = Math.max(r.oppInnings.length, r.userInnings.length);
  let head = '<tr><th>팀</th>'; for(let i=0;i<maxInn;i++) head+=`<th>${i+1}</th>`; head+='<th>R</th><th>H</th></tr>';
  const rowOf = (name, arr, runs, hits) => {
    let row = `<tr><th>${name}</th>`;
    for(let i=0;i<maxInn;i++) row += `<td>${arr[i] ?? ''}</td>`;
    row += `<td>${runs}</td><td>${hits}</td></tr>`;
    return row;
  };
  return `${nav('경기 결과')}
  <div class="screen">
    <div class="card">
      <div class="scoreBig">${r.userRuns} : ${r.oppRuns}</div>
      <div style="text-align:center;font-weight:800;color:${r.win?'#7ee787':'#ff8a8a'};">${r.win ? '승리!' : '패배'}</div>
      <table class="box"><thead>${head}</thead><tbody>
        ${rowOf(r.oppName, r.oppInnings, r.oppRuns, r.oppHits)}
        ${rowOf(r.userName, r.userInnings, r.userRuns, r.userHits)}
      </tbody></table>
      <div class="logBox">${r.log.map(l=>`<div>${l}</div>`).join('')}</div>
    </div>
    ${(r.leveled && r.leveled.length) ? `
    <div class="card">
      <div class="row"><b>⬆️ 레벨업한 선수</b><span class="statline">${r.leveled.length}명</span></div>
      <div style="margin-top:8px;">
      ${r.leveled.map(L=>{
        const detail = Object.keys(L.gained).map(k=>`${STAT_LABEL[k]} +${L.gained[k]}`).join(' · ');
        return `<div class="lineupRow">
          <div class="num">↑</div>
          <div class="nm">${L.name}<div class="statline">${detail || '능력치 최고치'}</div></div>
          <div class="st">Lv.${L.from} → <b style="color:#7fdc8a;">Lv.${L.to}</b></div>
        </div>`;
      }).join('')}
      </div>
    </div>` : `<div class="card"><div class="statline">이번 경기에서 레벨업한 선수는 없어요. 경기를 더 뛰면 경험치가 쌓여요.</div></div>`}
    <button class="btn" onclick="${r.isLeague ? "goto('league')" : "goto('friendly')"}">확인</button>
  </div>`;
}

/* ================= MODALS ================= */
function renderModal(){
  if(!state.modal) return '';
  const m = state.modal;
  if(m.type==='info'){
    return `<div class="modalOverlay"><div class="modalBox"><p>${m.text}</p><button class="btn" onclick="closeModal()">확인</button></div></div>`;
  }
  if(m.type==='reveal'){
    const c = m.card;
    const statLines = c.type==='batter'
      ? `컨택 ${c.contact} · 파워 ${c.power} · 스피드 ${c.speed}`
      : `제구 ${c.control} · 구위 ${c.stuff} · 체력 ${c.stamina}`;
    return `<div class="modalOverlay"><div class="modalBox" style="text-align:center;">
      <div style="font-size:13px;color:#9aa4b2;">새로운 선수 획득!</div>
      <div style="font-size:22px;font-weight:900;margin:10px 0 2px;">${c.name}</div>
      <div>${rarityChip(c.rarity)} <span class="statline">${c.teamId ? state.team.name+' · ' : ''}${c.pos}</span></div>
      <div class="statline" style="margin-top:8px;">${statLines}</div>
      <button class="btn" onclick="closeModal()">확인</button>
    </div></div>`;
  }
  if(m.type==='daily'){
    return `<div class="modalOverlay"><div class="modalBox">
      <div style="font-weight:800;margin-bottom:2px;">오늘의 선수 중 1명을 선택하세요</div>
      <div class="statline" style="margin-bottom:10px;">${state.team.name} 유망주 명단</div>
      ${state.dailyCandidates.map((c,i)=>`
        <div class="pickCard">
          <div><b>${c.name}</b> <span class="statline">${state.team.name} · ${c.pos}</span>
            <div class="statline">${c.type==='batter' ? `C${c.contact} P${c.power} S${c.speed}` : `제구${c.control} 구위${c.stuff} 체력${c.stamina}`}</div>
          </div>
          <button class="btn small" onclick="pickDaily(${i})">선택</button>
        </div>`).join('')}
      <button class="btn secondary" onclick="closeModal()">취소</button>
    </div></div>`;
  }
  if(m.type==='lineupPick'){
    const options = state.roster.batters.map(b=>`
      <div class="pickCard">
        <div><b>${b.name}</b> ${rarityChip(b.rarity)} <span class="statline">${b.pos}</span>
          <div class="statline">C${b.contact} P${b.power} S${b.speed}</div>
        </div>
        <button class="btn small" onclick="assignLineup(${m.slotIndex}, ${b.id})">배치</button>
      </div>`).join('');
    return `<div class="modalOverlay"><div class="modalBox">
      <div style="font-weight:800;margin-bottom:10px;">${m.slotIndex+1}번 타자 선택</div>
      ${options}
      <button class="btn secondary" onclick="closeModal()">취소</button>
    </div></div>`;
  }
  if(m.type==='pitcherPick'){
    const options = state.roster.pitchers.map(p=>`
      <div class="pickCard">
        <div><b>${p.name}</b> ${rarityChip(p.rarity)} <span class="statline">${p.pos}</span>
          <div class="statline">제구${p.control} 구위${p.stuff} 체력${p.stamina}</div>
        </div>
        <button class="btn small" onclick="assignPitcher(${p.id})">선발 등판</button>
      </div>`).join('');
    return `<div class="modalOverlay"><div class="modalBox">
      <div style="font-weight:800;margin-bottom:10px;">선발 투수 선택</div>
      ${options}
      <button class="btn secondary" onclick="closeModal()">취소</button>
    </div></div>`;
  }
  if(m.type==='rename'){
    const list = m.ptype==='batter' ? state.roster.batters : state.roster.pitchers;
    const p = list.find(x=>x.id===m.id);
    return `<div class="modalOverlay"><div class="modalBox">
      <div style="font-weight:800;margin-bottom:10px;">선수 이름 변경</div>
      <input id="renameInput" value="${p.name}" maxlength="12"
        style="width:100%;padding:11px;border-radius:8px;border:1px solid #2a3242;background:#0f131b;color:#fff;font-size:14px;margin-bottom:10px;">
      <button class="btn" onclick="saveRename(${m.id}, '${m.ptype}')">저장</button>
      <button class="btn secondary" onclick="closeModal()">취소</button>
    </div></div>`;
  }
  if(m.type==='relief'){
    const L = state.live;
    if(!L || !L.userStaff) return '';
    const s = L.userStaff;
    const rows = s.bullpen.map(p=>`
      <div class="pickCard">
        <div><b>${p.name}</b> <span class="statline">${p.pos}</span>
          <div class="statline">제구${p.control} 구위${p.stuff} 체력${p.stamina} · 약 ${staminaLimit(p)}타자</div>
        </div>
        <button class="btn small" onclick="doPitcherChange(${p.id})">투입</button>
      </div>`).join('') || `<div class="statline">더 이상 남은 투수가 없어요.</div>`;
    return `<div class="modalOverlay"><div class="modalBox">
      <div style="font-weight:800;margin-bottom:2px;">투수 교체</div>
      <div class="statline" style="margin-bottom:10px;">
        지금 투수: <b>${s.cur.name}</b> (${s.faced}타자 상대 · ${FATIGUE_LABEL[fatigueLevel(s.cur, s.faced)]})<br>
        한 번 내려간 투수는 다시 올릴 수 없어요.
      </div>
      ${rows}
      <button class="btn secondary" onclick="closeModal()">그냥 계속 던지기</button>
    </div></div>`;
  }
  if(m.type==='resetConfirm'){
    return `<div class="modalOverlay"><div class="modalBox" style="text-align:center;">
      <div style="font-size:34px;">⚠️</div>
      <div style="font-weight:900;font-size:17px;margin:8px 0 4px;">정말 처음부터 다시 시작할까요?</div>
      <div class="statline" style="line-height:1.6;">지금까지 모은 선수, 코인, 리그 기록이<br>모두 사라지고 되돌릴 수 없어요.</div>
      <button class="btn" style="background:linear-gradient(135deg,#d9455f,#8a0338);margin-top:14px;" onclick="doReset()">네, 전부 지우고 새로 시작</button>
      <button class="btn secondary" onclick="closeModal()">아니요, 취소</button>
    </div></div>`;
  }
  return '';
}

/* ================= MAIN RENDER ================= */
function render(){
  let html = '';
  switch(state.screen){
    case 'login': html = screenLogin(); break;
    case 'teamselect': html = screenTeamSelect(); break;
    case 'home': html = screenHome(); break;
    case 'shop': html = screenShop(); break;
    case 'lineup': html = screenLineup(); break;
    case 'missions': html = screenMissions(); break;
    case 'monthly': html = screenMonthly(); break;
    case 'goldenglove': html = screenGoldenGlove(); break;
    case 'league': html = screenLeague(); break;
    case 'livegame': html = screenLiveGame(); break;
    case 'pvpconnect': html = screenPvpConnect(); break;
    case 'pvpmatch': html = screenPvpMatch(); break;
    case 'friendly': html = screenFriendly(); break;
    case 'packs': html = screenPacks(); break;
    case 'roster': html = screenRoster(); break;
    case 'playerdetail': html = screenPlayerDetail(); break;
    case 'fuse': html = screenFuse(); break;
    case 'standings': html = screenStandings(); break;
    case 'stats': html = screenStats(); break;
    case 'matchresult': html = screenMatchResult(); break;
    default: html = screenTeamSelect();
  }
  html += renderModal();
  document.getElementById('app').innerHTML = html;
  showLive3D(state.screen === 'livegame' || state.screen === 'pvpmatch');
  saveGameSoon();
}

/* 게임 시작: 저장된 기록이 있으면 불러오고, 없으면 처음부터 */
/* 팀 이름을 창작 팀으로 바꾸기 전(v1)의 옛날 저장 데이터는 더 이상 못 쓰므로 정리 */
try{ localStorage.removeItem('kbo_manager_save_v1'); }catch(e){}
loadGame();
render();
</script>
